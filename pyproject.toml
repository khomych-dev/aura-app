[project]
name = "aura"
version = "0.1.0"
description = "Voice-to-text desktop app for Windows — record with Ctrl+Shift+Space, transcribe via Whisper, type instantly"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7.0",
    "openai>=1.30.0",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
aura = "aura.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "pyinstaller>=6.8.0",
    "pytest>=8.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aura"]

[tool.coverage.report]
# indicator.py, tray.py, main.py are PySide6 UI/entry-points: Third-party UI
# exception — no headless test support. Business-logic target: 70%+.
show_missing = true
omit = [
    "*/aura/indicator.py",
    "*/aura/tray.py",
    "*/aura/main.py",
]
fail_under = 70
